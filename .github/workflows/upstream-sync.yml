name: Upstream Sync (Auto-merge)

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 6:00 UTC (~11:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Uses a PAT with repo + workflow scopes so it CAN push changes
          # to .github/workflows/* (the default GITHUB_TOKEN is blocked
          # from touching workflow files, even with contents:write).
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Set date variable
        id: vars
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git || true
          git fetch upstream

      - name: Configure git identity
        run: |
          git config user.name "winplaybox-bot"
          git config user.email "bot@winplaybox.in"

      - name: Merge upstream into main
        id: merge
        run: |
          git checkout main
          if git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push merged changes
        if: steps.merge.outputs.status == 'success'
        run: git push origin main

      - name: Create conflict branch
        if: steps.merge.outputs.status == 'conflict'
        run: |
          BRANCH="upstream-sync-conflict-${{ steps.vars.outputs.date }}"
          git checkout -b "$BRANCH"
          git merge upstream/main --no-edit --allow-unrelated-histories || true
          git add -A
          git commit -m "Merge upstream (with conflicts) for manual resolution" || true
          git push origin "$BRANCH" -f
          git checkout main

      - name: Open PR if conflict occurred
        if: steps.merge.outputs.status == 'conflict'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          base: main
          branch: "upstream-sync-conflict-${{ steps.vars.outputs.date }}"
          title: "⚠️ Upstream sync conflict — manual review needed"
          body: |
            Auto-merge failed due to a conflict with upstream OmniRoute changes.
            Please resolve manually, keeping WinPlayBox branding/config intact.
          labels: upstream-sync, conflict
